<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tsumugin — 仮説ランキング (read-only)</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, "Segoe UI", sans-serif;
        margin: 0 auto;
        max-width: 1100px;
        padding: 1.5rem;
        line-height: 1.5;
      }
      h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
      .sub { color: #666; font-size: 0.85rem; margin-bottom: 1rem; }
      #flags { margin: 0.75rem 0; }
      .flag {
        display: inline-block;
        padding: 0.15rem 0.6rem;
        border-radius: 999px;
        font-size: 0.8rem;
        margin-right: 0.5rem;
      }
      .flag.warn { background: #fde68a; color: #7c2d12; }
      .flag.ok { background: #bbf7d0; color: #14532d; }
      table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
      th, td { border: 1px solid #d1d5db; padding: 0.4rem 0.6rem; text-align: right; }
      th { background: #f3f4f6; text-align: center; }
      td.id, td.phases { text-align: left; }
      tbody tr { cursor: pointer; }
      tbody tr:hover { background: #eef2ff; }
      tbody tr.close td { font-weight: 600; }
      #detail {
        margin-top: 1.25rem;
        padding: 1rem;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        white-space: pre-wrap;
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
        display: none;
      }
      #error { color: #b91c1c; }
    </style>
  </head>
  <body>
    <h1>tsumugin — 仮説ランキング</h1>
    <div class="sub">read-only 結果ビュー / GET <code>/api/result</code>・<code>/api/hypotheses/{id}</code></div>

    <div id="flags"></div>
    <div id="error"></div>

    <table id="ranking">
      <thead>
        <tr>
          <th>rank</th>
          <th>id</th>
          <th>probability</th>
          <th>Rwp</th>
          <th>GOF</th>
          <th>close</th>
          <th>good</th>
          <th>phases</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div id="detail"></div>

    <script>
      // 【描画エントリ】: /api/result を fetch し ranking テーブルと未知相フラグを描画する。
      async function loadRanking() {
        const errBox = document.getElementById("error");
        try {
          const resp = await fetch("/api/result");
          if (!resp.ok) throw new Error("GET /api/result -> " + resp.status);
          const data = await resp.json();
          renderFlags(data);
          renderRows(data.ranked || []);
        } catch (e) {
          errBox.textContent = "結果の取得に失敗しました: " + e.message;
        }
      }

      // 【フラグ表示】: 未知相フラグ・仮説数を常時トップに表示する。
      function renderFlags(data) {
        const box = document.getElementById("flags");
        const unknown = data.unknown_phase_flag === true;
        const cls = unknown ? "flag warn" : "flag ok";
        const label = unknown ? "未知相フラグ: あり" : "未知相フラグ: なし";
        box.innerHTML =
          '<span class="' + cls + '">' + label + "</span>" +
          '<span class="flag ok">仮説数: ' + (data.n_hypotheses ?? 0) + "</span>";
      }

      // 【行描画】: ranked 各行をテーブル化し、クリックで詳細取得を紐付ける。
      function renderRows(rows) {
        const tbody = document.querySelector("#ranking tbody");
        tbody.innerHTML = "";
        for (const r of rows) {
          const tr = document.createElement("tr");
          if (r.close_competitor) tr.classList.add("close");
          const phases = (r.phases || []).map((p) => p.phase_ref).join(" + ");
          tr.innerHTML =
            "<td>" + r.rank + "</td>" +
            '<td class="id">' + r.id + "</td>" +
            "<td>" + fmt(r.probability) + "</td>" +
            "<td>" + fmt(r.rwp) + "</td>" +
            "<td>" + fmt(r.gof) + "</td>" +
            "<td>" + (r.close_competitor ? "●" : "") + "</td>" +
            "<td>" + (r.in_good_cluster ? "●" : "") + "</td>" +
            '<td class="phases">' + phases + "</td>";
          tr.addEventListener("click", () => loadDetail(r.id));
          tbody.appendChild(tr);
        }
      }

      // 【詳細取得】: 行クリックで /api/hypotheses/{id} を fetch し JSON を表示する。
      async function loadDetail(id) {
        const box = document.getElementById("detail");
        box.style.display = "block";
        box.textContent = "loading " + id + " ...";
        try {
          const resp = await fetch("/api/hypotheses/" + encodeURIComponent(id));
          if (!resp.ok) throw new Error("status " + resp.status);
          const data = await resp.json();
          box.textContent = JSON.stringify(data, null, 2);
        } catch (e) {
          box.textContent = "詳細の取得に失敗しました (" + id + "): " + e.message;
        }
      }

      function fmt(v) {
        return typeof v === "number" ? v.toFixed(4) : v == null ? "-" : v;
      }

      loadRanking();
    </script>
  </body>
</html>
