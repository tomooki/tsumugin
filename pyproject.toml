[project]
name = "tsumugin"
version = "0.1.0"
description = "多仮説・全自動 Rietveld 解析プラットフォーム (PoC / M0)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
# GSAS-II 本体は PyPI 非公開のためソースツリー (.pth) + buildtools バイナリで導入する。
# ここにはそのランタイム依存のみを置く。導入手順は README を参照。
gsas = [
    "scipy>=1.11",
    "pycifrw>=4.4",
    "requests>=2.31",
]
# M1 Web UI 最小版 (read-only): FastAPI アプリ + uvicorn 起動。
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
# M4 MCP サーバ (SDK 依存アダプタ層): 公式 Model Context Protocol Python SDK。
# ``mcp.server`` は本 extra を遅延 import する。未導入時は MCPUnavailableError へ縮退する。
mcp = [
    "mcp>=1.0",
]
# M5 nested sampling (階層的裁定の再裁定バックエンド): dynesty を主とする外部サンプラ。
# ``nested.sampler`` は本 extra を遅延 import し、未導入時は NestedUnavailableError へ縮退して
# Laplace evidence へフォールバックする (較正・裁定はコア numpy のみで動作する)。
nested = [
    "dynesty>=2.1",
]
# M5 MEM (最大エントロピー法) バックエンド: 実ソルバ Dysnomia は外部バイナリで PyPI 非公開のため
# ここには runtime python 依存のみを置く (現状なし)。Dysnomia 本体は別途バイナリ導入し PATH を通す。
# ``DysnomiaBackend`` は実行時にバイナリを起動し、未検出時は MEMUnavailableError へ縮退する。
mem = [
]
# M5 OED (最適実験計画) の獲得関数接続: PyBOED (pyboed)。pyboed は PyPI 未公開のため
# ここには runtime python 依存のみを置く (現状なし)。pyboed 本体は別途 (ソース/私設 index から)
# 導入する。``oed.pyboed.acquire`` は本 extra を遅延 import し、未導入時は OEDUnavailableError へ
# 縮退する (v1 の提案生成 propose_measurements は本 extra に非依存でコアのみで動作する)。
oed = [
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsumugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "gsas: GSAS-II がインストールされている環境でのみ実行する contract test",
    "mcp: MCP SDK (optional extra mcp) がインストールされている環境でのみ実行する",
    "nested: 外部サンプラ (optional extra nested: dynesty/ultranest) がインストールされている環境でのみ実行する",
    "mem: MEM 外部バイナリ (Dysnomia) がインストールされている環境でのみ実行する",
    "oed: OED 獲得関数 (optional extra oed: pyboed) がインストールされている環境でのみ実行する",
]

[tool.ruff]
line-length = 100
target-version = "py312"
