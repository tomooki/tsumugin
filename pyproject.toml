[project]
name = "tsumugin"
version = "0.1.0"
description = "Multi-hypothesis automated Rietveld refinement for X-ray and neutron powder diffraction"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Tomooki Hosaka" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
# GSAS-II 本体は PyPI 非公開のためソースツリー (.pth) + buildtools バイナリで導入する。
# ここにはそのランタイム依存のみを置く。導入手順は README を参照。
gsas = [
    "scipy>=1.11",
    "pycifrw>=4.4",
    "requests>=2.31",
]
# M1 Web UI 最小版 (read-only): FastAPI アプリ + uvicorn 起動。
# python-multipart は V2a workbench の POST /api/project/upload (multipart フォーム) に必要
# (fastapi の UploadFile/Form パーサが実行時に要求する; 未導入時は fastapi 側が明示エラーを出す)。
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]
# M4 MCP サーバ (SDK 依存アダプタ層): 公式 Model Context Protocol Python SDK。
# ``mcp.server`` は本 extra を遅延 import する。未導入時は MCPUnavailableError へ縮退する。
mcp = [
    "mcp>=1.0",
]
# M5 nested sampling (階層的裁定の再裁定バックエンド): dynesty を主とする外部サンプラ。
# ``nested.sampler`` は本 extra を遅延 import し、未導入時は NestedUnavailableError へ縮退して
# Laplace evidence へフォールバックする (較正・裁定はコア numpy のみで動作する)。
nested = [
    "dynesty>=2.1",
]
# M5 MEM (最大エントロピー法) バックエンド: 実ソルバ Dysnomia は外部バイナリで PyPI 非公開のため
# ここには runtime python 依存のみを置く (現状なし)。Dysnomia 本体は別途バイナリ導入し PATH を通す。
# ``DysnomiaBackend`` は実行時にバイナリを起動し、未検出時は MEMUnavailableError へ縮退する。
mem = [
]
# M5 OED (最適実験計画) の獲得関数接続: PyBOED (pyboed)。pyboed は PyPI 未公開のため
# ここには runtime python 依存のみを置く (現状なし)。pyboed 本体は別途 (ソース/私設 index から)
# 導入する。``oed.pyboed.acquire`` は本 extra を遅延 import し、未導入時は OEDUnavailableError へ
# 縮退する (v1 の提案生成 propose_measurements は本 extra に非依存でコアのみで動作する)。
oed = [
]
# M6 相同定 (相ライブラリ供給元): Materials Project 取り込み + 実構造 XRD 生成。
# ``tsumugin.mp`` は本 extra を遅延 import し、未導入時は MPUnavailableError へ縮退する。
# 相同定コア (``tsumugin.reference.identify_phases``) と ReferenceProvider Protocol は
# 本 extra に非依存でコア (numpy) のみで動作する。API キーは環境変数 MATERIALS_PROJECT_API。
mp = [
    "pymatgen>=2024.3",
    "mp-api>=0.41",
]
# Issue #54 固定吸収体レイヤー補正: 組成→μ (原子散乱因子 f'') の算出に用いる。
# ``autorietveld.absorption.mu_from_composition`` は本 extra を遅延 import し、未導入時は
# ImportError へ縮退する (transmission_correction/apply_absorption_correction は本 extra に非依存)。
absorption = [
    "periodictable>=1.6",
]
# operando 電気化学同期 (M10): BioLogic EC-Lab .mpr の読み取りに galvani を使う。
# ``interop.biologic.parse_mpr`` は本 extra を遅延 import し、未導入時は EchemUnavailableError へ
# 縮退する (曲線の整列 curve_from_mpr_data / align_frames は本 extra に非依存でコアのみで動作する)。
echem = [
    "galvani>=0.4",
]
# V3a AUTO 実 LLM ブリッジ: ローカル `claude` CLI サブスクリプションを Python から駆動する
# 公式 Agent SDK。``workbench.agent_bridge``/``workbench.agent_mcp`` は本 extra を遅延 import し、
# 未導入時は AgentBridge.available=False (GET /api/agent/status) へ縮退する (POST
# /api/transcript/message は従来の記録のみ動作へフォールバックする)。
agent = [
    "claude-agent-sdk>=0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    # lint ゲートの決定論化: uvx (最新解決) だと ruff の新バージョン公開で既存コードが
    # 突然大量 flag される (2026-07-23 に 0.16.0 の新既定規則で 586 件)。ゲートは
    # `uv run ruff check src tests` に固定し、更新は本ピンの引き上げで意図的に行う。
    "ruff==0.14.0",
    # V2c C1: desktop sidecar (Tauri externalBin/resources) を PyInstaller で固めるための
    # ビルド専用依存。実行時 (アプリ配布物) には含まれない — `desktop/sidecar/build_sidecar.ps1`
    # からのみ使う。
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsumugin"]

# 【sdist に何を入れるかを明示する】: hatchling の既定は「gitignore されていないもの」なので、
# **追跡外のローカル作業ディレクトリまで同梱される**。実測で `.claude/worktrees/`
# (エージェントが作る git worktree = リポジトリの完全コピー) が入り、sdist が 22.6 MB /
# 7388 エントリになっていた。docs/ (未確認の再配布物を含む testdata)・frontend/ の
# node_modules 派生・desktop/ のビルド成果も配布物には要らない。
#
# **既定に任せず列挙する** — 「入れないもの」を数え上げる方式は、新しいディレクトリが
# 増えるたびに黙って漏れる。
[tool.hatch.build.targets.sdist]
include = [
    "src/tsumugin",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# import-mode=importlib: 同名 basename のテストファイル (tests/test_model.py と
# tests/insitu/anchor/test_model.py 等) を sys.path/__init__.py に依存せず一意な
# モジュール名で import する。prepend 既定では basename 衝突で collection が中断する
# (Issue #31)。importlib は sys.path を汚さないため src レイアウトとも相性が良い。
addopts = "-q --import-mode=importlib"
markers = [
    "gsas: GSAS-II がインストールされている環境でのみ実行する contract test",
    "topas: Bruker TOPAS (コンソール実行体 tc.exe) が導入されている環境でのみ実行する",
    "mcp: MCP SDK (optional extra mcp) がインストールされている環境でのみ実行する",
    "nested: 外部サンプラ (optional extra nested: dynesty/ultranest) がインストールされている環境でのみ実行する",
    "mem: MEM 外部バイナリ (Dysnomia) がインストールされている環境でのみ実行する",
    "oed: OED 獲得関数 (optional extra oed: pyboed) がインストールされている環境でのみ実行する",
    "mp: Materials Project 供給元 (optional extra mp: pymatgen/mp-api) がインストールされている環境でのみ実行する",
    "agent: ローカル claude CLI + claude-agent-sdk (optional extra agent) が利用可能な環境でのみ実行する実サブスクリプション疎通テスト",
]

[tool.ruff]
line-length = 100
target-version = "py312"
