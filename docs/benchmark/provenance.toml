# ベンチマーク成果物の由来宣言 (公開リポジトリの安全弁)
#
# **なぜ要るか**: v0.1 公開時、未公開実験データ (NaCuHCF·nD₂O) の精密化結果
# (Rwp・占有率と esd) が `docs/benchmark/joint/results/` と `docs/benchmark/README.md`
# の両方に載ったまま public になった。`.gitignore` は `results/*.gpx` と**拡張子スコープ**
# だったため、同じ精密化から出る csv/log が網から漏れていた。
#
# 「気をつける」では再発する。**由来を宣言させ、宣言と追跡状態の食い違いを機械検査する**
# (`tests/test_docs_provenance.py`)。本リポジトリが ①②③ の露出で採っているのと同じ型 —
# 黙ってやらせず、宣言させる。
#
# ## 規約
#
# - `docs/benchmark/` 直下の各エントリ (ディレクトリまたはファイル) は、追跡ファイルを
#   1 つでも持つならここに宣言する。
# - `provenance` は次のいずれか:
#     public    — 公開データ (`source` 必須)
#     synthetic — 合成データ (実測でない)
#     private   — **未公開の実験データ**。測定値の追跡は禁止。
# - `private` エントリで追跡してよいファイルは `tracked_exceptions` に**1 件ずつ理由付きで**
#   列挙したものだけ (再生成スクリプト等、測定値を含まないもの)。
# - 測定結果の出力先は `*/results/` とし、既定で gitignore する (`.gitignore` 参照)。
#   公開したい成果物だけを `git add -f` で明示的に上げる — **既定を安全側に倒す**。
#
# 設計文書 (`docs/design/`・`docs/spec/`) には**測定値の表を置かない**。根拠として 1 値を
# 引くのは可だが、一覧はベンチ側に置いてリンクする (混ざると由来の追跡が効かなくなる)。

[entries."README.md"]
provenance = "public"
source = "各ベンチの索引。個別の由来は各エントリを参照"

[entries."gui-sequential-14frames.md"]
provenance = "public"
source = "Jana2020 Cookbook Example 02.6 'CaTeO3 cyclic'"

[entries."fit-then-judge-quasi"]
provenance = "public"
source = "fit-then-judge P0 §3.1 (U10) 準 hold-out の事例表の照合スクリプト (出発 CIF = GSAS-II チュートリアル / 参照 = COD)"
note = """
追跡するのはスクリプトだけ。標準出力は判定と件数 (空間群一致・対応原子数・esd の付いた自由座標数・印字精度での全一致) のみで、
座標・esd は表示しない。原子の対応表と sha256 はリポジトリの外の私有ファイルに書く。参照 CIF は開発のコードから読まない (P0 §3.1)。
"""

[entries."fit-then-judge-hpub"]
provenance = "public"
source = "fit-then-judge P0 §3.2.1 の H-pub 候補一覧の生成スクリプト (RRUFF + COD のスナップショット 2026-10-13 を読む)"
note = """
追跡するのはスクリプト (candidates.py / manifest.py) と、凍結時に commit する候補 manifest (candidates_manifest.json:
salt 付き ID ハッシュ・件数・除外理由の種類ごとの件数) と全事例に共通の汎用装置パラメータ (hpub_generic_lab.instprm:
S-dev の生成器で宣言した合成の値そのまま = synthetic)。入力のスナップショット・候補の平文の ID・salt・実行の ledger は
リポジトリの外 (P0 §3.2.1-4)。RRUFF のデータは再配布しない (U14)。
"""

[entries."fit-then-judge-synthetic"]
provenance = "synthetic"
source = "fit-then-judge P0 §6 の合成 S-dev (COD の CC0 構造から GSAS-II calc-only + Poisson 雑音で生成)"
note = """
追跡するのは生成器・事例の定義・manifest だけ。パターンと CIF は `results/` (gitignore) に再生成する
(manifest の sha256 で同一性を確かめる)。構造の出典は COD の ID・svnrevision・sha256 (CC0)。
"""

[entries."calibration"]
provenance = "synthetic"
source = "確率較正ベンチ (合成仮説集合; 実測データを用いない)"
note = """
`calibration/results/` は `.gitignore` の `docs/benchmark/*/results/` より前から追跡されて
おり、ignore は追跡済みファイルに効かないので残っている。**合成データなので公開して問題は
無い**が、「results/ は ignore されるはず」という思い込みで新しい実測結果を同じ場所へ置くと
追跡されてしまう。実測を扱うベンチでは `git status` を必ず確認すること。
"""

[entries."m12-topas"]
